server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ── SPA fallback — all non-file routes serve index.html ──────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API proxy → Flask backend ─────────────────────────────────────────────
    # Timeouts are set generously to handle:
    #   • Bulk resume uploads (up to 100 files, ~10 MB each)
    #   • Ollama evaluation which can take several minutes per batch
    location /api/ {
        proxy_pass         http://backend:3001;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Long timeouts for AI evaluation and large file uploads
        proxy_read_timeout   660s;
        proxy_send_timeout   660s;
        proxy_connect_timeout 10s;

        # Disable buffering so streaming responses pass through immediately
        proxy_buffering    off;

        # Allow large multipart bodies (resume batch uploads)
        client_max_body_size 512m;
    }

    # ── Health check endpoint served by nginx itself ──────────────────────────
    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy       "strict-origin" always;

    # ── Static asset caching ──────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Gzip compression
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
}
